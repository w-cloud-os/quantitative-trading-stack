services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/app/configs:ro
      - data_cache:/app/.data_cache

  # One-off CLI backtest (cross-checks both engines):  docker compose --profile tools run --rm backtest
  backtest:
    build: .
    profiles: ["tools"]
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/app/configs:ro
      - data_cache:/app/.data_cache
    command: ["quant-stack", "backtest", "--config", "configs/paper_trading.yaml", "--engine", "both"]

volumes:
  data_cache:
