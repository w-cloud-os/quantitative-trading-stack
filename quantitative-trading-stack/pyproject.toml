[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quant-stack"
version = "0.2.0"
description = "Educational paper-trading research stack: skfolio optimization + NautilusTrader execution"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "skfolio>=1.12,<2",
    "nautilus_trader>=1.231,<1.232",   # pinned tightly: its API changes between releases
    "pandas>=3.0,<4",
    "numpy>=2.0",
    "scikit-learn>=1.7",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pyarrow>=15",
    "streamlit>=1.40",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.50"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
quant-stack = "quant_stack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_stack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["nautilus: slower tests that run the NautilusTrader engine"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*utcnow.*"]
